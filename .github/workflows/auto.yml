name: Juejin daily check-in

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions 使用 UTC；23:00 UTC 即次日北京时间 07:00。
    - cron: '0 23 * * *'

permissions:
  contents: read

concurrency:
  group: juejin-daily-check-in
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      JUEJIN_COOKIE: ${{ secrets.JUEJIN_COOKIE }}
      QQ_EMAIL_USER: ${{ secrets.QQ_EMAIL_USER }}
      QQ_EMAIL_AUTH_CODE: ${{ secrets.QQ_EMAIL_AUTH_CODE }}
      QQ_EMAIL_TO: ${{ secrets.QQ_EMAIL_TO }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check in and draw lottery
        run: node index.js
